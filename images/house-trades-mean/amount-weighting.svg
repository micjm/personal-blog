   <text style="fill: #273440; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="12.96" y="25.877344" transform="rotate(-0 12.96 25.877344)">Bigger trades change the averages, too</text>
  </g>
  <g id="text_28">
   <text style="fill: #64717e; font: 9px 'DejaVu Sans'" transform="translate(12.96 319.177969)">Blue: bigger trades count more   Gray: each trade counts equally   Lines: 90% uncertainty ranges</text>
   <text style="fill: #64717e; font: 9px 'DejaVu Sans'" transform="translate(12.96 329.256)">Six-month returns. Trade sizes estimated from the middle of each reported dollar range.</text>
  </g>
